# Name of the action.
name: Artifact Releaser

# Controls when the action will run.
on:
  # Triggers the workflow on push events but only for certain file changes on the main branch
  push:
    branches: [ cicd-implementation-main ]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
    android-build:
        name: Android Build
        runs-on: ubuntu-latest
        permissions:
          contents: write
        env:
          GIT_REPO: arongamith/BudgeBuddyFinal
          GH_TOKEN: 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
        steps:
          - name: Checkout to cicd branch
            uses: actions/checkout@v3
            with:
              ref: cicd-implementation-main

          - name: Install Java 17
            uses: actions/setup-java@v4
            with:
              distribution: 'zulu' # See 'Supported distributions' for available options
              java-version: '17'
              cache: 'gradle'
          - name: Validate Gradle wrapper
            uses: gradle/wrapper-validation-action@v1

          - name: npm version check
            run: npm -v
          - name: Install npm dependency
            run: npm install

          - name: Setup Android SDK
            uses: android-actions/setup-android@v2

          - name: Setup Gradle
            uses: gradle/gradle-build-action@v2
          - name: Execute Gradle build
            run: |
              cd android
              ./gradlew assembleRelease
          - name: Check apk file
            run: |
              ls -lh android/app/build/outputs/apk/release/

          - name: Install the github cli
            run: |
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt update
              sudo apt install gh
              gh version
              
          - name: Release GitHub Artifacts
            id: release_github_artifacts
            run: |
              
              # Get current version
              current_tag_name=$(gh release view --repo ${{ env.GIT_REPO }} --json tagName --jq '.tagName' || true)
              
              # Version control
              echo "current latest tag name: $current_tag_name"
              output=$(echo $current_tag_name | grep -oP '\d+\.\d+')
              echo "OUTPUT: $output"
              tag_version=$(echo $current_tag_name | grep -oP '\d+\.\d+')
              IFS="." read -ra ver_compo <<< "$tag_version"

              # Extract major and minor versions
              major_v="${ver_compo[0]}" 
              minor_v="${ver_compo[1]}"
              
              # Increase the minor version by 1
              minor_v=$(($minor_v + 1))
              
              echo $minor_v
              # New GitHub Release tag
              new_github_tag_name="$major_v.$minor_v"
              echo "Release Tag: $new_github_tag_name"

              ls -lh android/app/build/outputs/apk/release/

              # Release the Pack
             # gh release create $new_github_tag_name --title BudgeBuddy - $new_github_tag_name --notes "Release notes for version $new_github_tag_name"
             # gh release upload $new_github_tag_name  android/app/build/outputs/apk/release/app-release.apk
             # echo "Artifacts uploaded to GitHub release."
