# Name of the action.
name: Artifact Releaser

# Controls when the action will run.
on:
  # Triggers the workflow on push events but only for certain file changes on the main branch
  push:
    branches: [ cicd-implementation-main ]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
    android-build:
        name: Android Build
        runs-on: ubuntu-latest
        steps:
          - name: Checkout to cicd branch
            uses: actions/checkout@v3
            with:
              ref: cicd-implementation-main
          - name: Java version check
            run: java --version
          - name: Install Java
            uses: actions/setup-java@v4
            with:
              distribution: 'zulu' # See 'Supported distributions' for available options
              java-version: '17'
          - name: Java version check
            run: java --version
          - name: npm version check
            run: npm -v
          - name: Install npm dependency
            run: npm install
          - name: check directory.
            run: ls -lh
          - name: Setup Android SDK
            uses: android-actions/setup-android@v2
          - name: check directory sdk.
            run: ls -lh
          - uses: actions/cache@v3
            with:
              path: |
                ~/.gradle/caches
                ~/.gradle/wrapper
              key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
              restore-keys: |
                ${{ runner.os }}-gradle-
          - name: Setup Gradle
            uses: gradle/gradle-build-action@v2
          - name: Execute Gradle build
            run: |
              cd android
              ./gradlew build
          - name: Build Android JS Bundle via react-native
            run: |
              react-native bundle --platform android --dev false \
              --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle \
              --assets-dest android/app/src/main/res
          

          